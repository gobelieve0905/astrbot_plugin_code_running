<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代码执行任务</title><style>body{font:16px system-ui;background:#f5f7fa;color:#202838;margin:0}main{max-width:960px;margin:48px auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between}article{background:white;padding:24px;margin:16px 0;border:1px solid #dce2eb;border-radius:12px}button{padding:8px 18px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto}small{color:#586579}#guide-panel{background:white;border:1px solid #dce2eb;border-radius:12px;padding:18px 24px;margin:20px 0}summary{cursor:pointer;font-weight:600}#guide-tabs{display:flex;gap:8px;flex-wrap:wrap}#guide-tabs button[aria-pressed="true"]{background:#23675e;color:white}#guide-content{max-height:560px;font:14px/1.8 system-ui;user-select:text}button{border:1px solid #dce2eb;border-radius:6px;background:white}button:focus-visible,summary:focus-visible{outline:2px solid #23675e;outline-offset:3px}</style></head><body><main><header><h1>代码执行任务</h1><button id="refresh">刷新</button></header><p>查看运行进度、结果文件和调用次数。记录与文件保留 24 小时，最多 50 个任务。</p><p id="notice" role="status"></p><details id="guide-panel"><summary>执行环境手册</summary><p>插件已内置执行环境手册，不规定业务流程。Agent 获准使用代码工具时自动获得读取指引，无需修改人格或开启原生 Computer Use。</p><p>代码执行需要管理员部署独立隔离服务；未部署时不会退回宿主执行。API 插件可单独使用；代码插件不接 API 时也能处理文件与计算。</p><nav id="guide-tabs" aria-label="指南章节"></nav><p id="guide-notice" role="status"></p><pre id="guide-content"></pre><button id="guide-retry" type="button">重新加载指南</button></details><section id="jobs"></section></main><script src="./app.js"></script></body></html>
